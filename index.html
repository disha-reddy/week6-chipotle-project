document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"1bb7a27d-b431-42ec-a26a-a334996d08a8\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<title>Chipotle | Digital Transformation Case<\u002Ftitle>\n<script src=\"62e70d51-4c47-42eb-9dad-c51ef408c839\"><\u002Fscript>\n<style>\nbody{margin:0;background:#fbf8f3;color:#2a2a2a;font-family:\"Helvetica Neue\",Arial,sans-serif;-webkit-font-smoothing:antialiased}\n*{box-sizing:border-box}\na{color:#a81612;text-decoration:none}\na:hover{color:#451400}\nbutton{font:inherit;cursor:pointer}\np{line-height:1.6;margin:0}\nh1,h2,h3{margin:0}\ninput[type=range]{accent-color:#a81612;width:100%}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<header style=\"position:sticky;top:0;z-index:20;background:#fbf8f3;border-bottom:1px solid #d1d1d1;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 4%;height:76px\">\n  <button sc-camel-on-click=\"{{ goHome }}\" style=\"all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;color:#451400;font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;font-size:19px;letter-spacing:-0.03em\">\n    <span style=\"width:36px;height:36px;border-radius:50%;background:#a81612;color:#fbf8f3;display:inline-flex;align-items:center;justify-content:center;font-size:22px\">C<\u002Fspan>\n    <span>Chipotle Case<\u002Fspan>\n  <\u002Fbutton>\n  <nav style=\"display:flex;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700\">\n    <button sc-camel-on-click=\"{{ goHome }}\" style=\"all:unset;cursor:pointer;padding:8px 12px;border-bottom:3px solid {{ navHome }};color:#451400\">Home<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ goQbr }}\" style=\"all:unset;cursor:pointer;padding:8px 12px;border-bottom:3px solid {{ navQbr }};color:#451400\">QBR Dashboard<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ goRoadmap }}\" style=\"all:unset;cursor:pointer;padding:8px 12px;border-bottom:3px solid {{ navRoadmap }};color:#451400\">Roadmap &amp; RACI<\u002Fbutton>\n  <\u002Fnav>\n<\u002Fheader>\n\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n<main data-screen-label=\"Home\">\n\n  <section style=\"border-bottom:6px solid #a81612;padding:64px 4%;display:flex;flex-wrap:wrap;gap:48px;align-items:center\">\n    <div style=\"flex:1.3 1 360px;min-width:0\">\n      <h1 style=\"font-family:'Arial Black','Trebuchet MS',Arial,sans-serif;font-weight:900;color:#451400;font-size:clamp(52px,8vw,124px);letter-spacing:-0.06em;line-height:1;padding-bottom:0.06em;white-space:nowrap\">Chipotle<\u002Fh1>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 320px;max-width:440px;margin-left:auto\">\n      <p style=\"font-size:17px;margin-bottom:28px;text-wrap:pretty\">An eight-quarter plan that connects digital ordering, kitchen work and Rewards, with checks that stop expansion when a pilot misses its targets.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <button sc-camel-on-click=\"{{ goQbr }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 22px;background:#a81612;color:#fbf8f3;border:2px solid #a81612;border-radius:10px;text-align:left\" style-hover=\"background:#451400;border-color:#451400\">\n          <span style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:19px;font-weight:700\">QBR Dashboard<\u002Fspan><\u002Fspan>\n          <span style=\"font-size:22px\">→<\u002Fspan>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goRoadmap }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 22px;background:#fff;color:#451400;border:2px solid #451400;border-radius:10px;text-align:left\" style-hover=\"background:#451400;color:#fbf8f3\">\n          <span style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:19px;font-weight:700\">Roadmap &amp; RACI<\u002Fspan><\u002Fspan>\n          <span style=\"font-size:22px\">→<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:85px 4%;border-bottom:1px solid #d1d1d1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:40px\">\n    <div>\n      <p style=\"color:#a81612;font-weight:700;font-size:12px;letter-spacing:0.055em;text-transform:uppercase;margin-bottom:14px\">The case<\u002Fp>\n      <h2 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:clamp(32px,3.6vw,48px);letter-spacing:-0.035em;line-height:1.05;text-wrap:balance\">Digital is only part of the job.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"grid-column:span 2;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:36px;max-width:900px\">\n      <p style=\"text-wrap:pretty\">Chipotle added digital ordering, separate kitchen lines, Rewards and pickup lanes called Chipotlanes. These pieces depend on each other. More app orders can still mean longer waits if the kitchen cannot keep up.<\u002Fp>\n      <p style=\"text-wrap:pretty\">The 2018–2023 annual reports were used to build an eight-quarter plan. The trial sizes, checks and decision owners are part of this proposal. The Q7 figures are example values that show how a quarterly review works.<\u002Fp>\n      <div style=\"grid-column:1/-1;display:flex;flex-wrap:wrap;gap:56px;margin-top:8px\">\n        <div style=\"display:flex;flex-direction:column\"><b style=\"font-family:'Trebuchet MS',Arial,sans-serif;color:#a81612;font-size:56px;letter-spacing:-0.04em\">8<\u002Fb><span style=\"color:#5c514c;font-size:13px\">Initiatives<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column\"><b style=\"font-family:'Trebuchet MS',Arial,sans-serif;color:#a81612;font-size:56px;letter-spacing:-0.04em\">3<\u002Fb><span style=\"color:#5c514c;font-size:13px\">Phases, with checks before expansion<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column\"><b style=\"font-family:'Trebuchet MS',Arial,sans-serif;color:#a81612;font-size:56px;letter-spacing:-0.04em\">7<\u002Fb><span style=\"color:#5c514c;font-size:13px\">Recurring decisions<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:85px 4%;border-bottom:1px solid #d1d1d1\">\n    <p style=\"color:#a81612;font-weight:700;font-size:12px;letter-spacing:0.055em;text-transform:uppercase;margin-bottom:14px\">01 / The order journey<\u002Fp>\n    <h2 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:clamp(32px,4.4vw,60px);letter-spacing:-0.035em;line-height:1.05;margin-bottom:18px;text-wrap:balance\">What has to happen after checkout?<\u002Fh2>\n    <p style=\"max-width:720px;font-size:17px\">Select each stop to see how the technology connects to the work in the restaurant.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:18px;margin-top:34px\">\n      <sc-for list=\"{{ journey }}\" as=\"j\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ j.pick }}\" style=\"text-align:left;padding:24px;border-radius:10px;border:1px solid {{ j.border }};background:{{ j.bg }};color:{{ j.fg }};box-shadow:0 6px 24px #4514000d;display:flex;flex-direction:column;gap:10px\">\n          <span style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;font-size:44px;letter-spacing:-0.04em\">{{ j.num }}<\u002Fspan>\n          <span style=\"font-size:11px;letter-spacing:0.055em;text-transform:uppercase;opacity:0.8\">{{ j.tag }}<\u002Fspan>\n          <span style=\"font-size:22px;font-weight:700\">{{ j.title }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"max-width:820px;padding:30px 0 0;min-height:150px\">\n      <p style=\"color:#a81612;font-weight:700;font-size:12px;letter-spacing:0.055em;text-transform:uppercase\">{{ journeyActive.tag }}<\u002Fp>\n      <p style=\"font-size:21px;margin-top:10px;color:#2a2a2a;text-wrap:pretty\">{{ journeyActive.text }}<\u002Fp>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ goRoadmap }}\" style=\"all:unset;cursor:pointer;border-bottom:2px solid #a81612;color:#a81612;font-weight:700;font-size:15px;padding:4px 0 6px\">See how this becomes the roadmap →<\u002Fbutton>\n  <\u002Fsection>\n\n  <section style=\"padding:85px 4%;border-bottom:1px solid #d1d1d1;background:#f4efeb\">\n    <p style=\"color:#a81612;font-weight:700;font-size:12px;letter-spacing:0.055em;text-transform:uppercase;margin-bottom:14px\">02 / Decision rights<\u002Fp>\n    <h2 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:clamp(32px,4.4vw,60px);letter-spacing:-0.035em;line-height:1.05;margin-bottom:18px;text-wrap:balance\">Who should own the decision?<\u002Fh2>\n    <p style=\"max-width:720px;font-size:17px\">Pick a decision, choose who should be accountable, then compare with the plan.<\u002Fp>\n    <label style=\"display:block;color:#451400;font-weight:700;font-size:14px;margin:30px 0 10px\">Decision<\u002Flabel>\n    <sc-raw-select value=\"{{ raciDecision }}\" sc-camel-on-change=\"{{ onDecision }}\" style=\"width:100%;max-width:900px;padding:16px;border:1px solid #451400;border-radius:8px;background:#fff;color:#451400;font-size:16px\">\n      <sc-for list=\"{{ decisions }}\" as=\"d\" hint-placeholder-count=\"7\">\n        <option value=\"{{ d.id }}\">{{ d.label }}<\u002Foption>\n      <\u002Fsc-for>\n    <\u002Fsc-raw-select>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:24px 0;max-width:900px\">\n      <sc-for list=\"{{ roleChoices }}\" as=\"r\" hint-placeholder-count=\"8\">\n        <button sc-camel-on-click=\"{{ r.pick }}\" style=\"text-align:left;padding:16px 18px;border-radius:10px;border:1px solid {{ r.border }};background:{{ r.bg }};color:{{ r.fg }};display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font-size:20px;font-weight:700\">{{ r.code }}<\u002Fspan>\n          <span style=\"font-size:12px;opacity:0.85;line-height:1.35\">{{ r.name }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"max-width:900px;background:#fff;border:1px solid #d1d1d1;border-radius:12px;padding:28px;box-shadow:0 6px 24px #4514000d\">\n      <sc-if value=\"{{ hasRolePick }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"font-weight:700;font-size:13px;letter-spacing:0.05em;text-transform:uppercase;color:{{ verdictColor }};margin-bottom:10px\">{{ verdict }}<\u002Fp>\n        <h3 style=\"font-family:'Trebuchet MS',Arial,sans-serif;color:#451400;font-size:24px;margin-bottom:12px\">Accountable: {{ activeDecision.a }}<\u002Fh3>\n        <p style=\"margin-bottom:16px\">{{ activeDecision.why }}<\u002Fp>\n        <p style=\"font-weight:700;color:#451400;font-size:14px;margin-bottom:6px\">How the decision is enforced<\u002Fp>\n        <p>{{ activeDecision.enforce }}<\u002Fp>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ noRolePick }}\" hint-placeholder-val=\"{{ true }}\">\n        <p style=\"color:#5c514c\">Choose a role to see the reasoning.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n\n  <section style=\"padding:85px 4%;border-bottom:1px solid #d1d1d1\">\n    <p style=\"color:#a81612;font-weight:700;font-size:12px;letter-spacing:0.055em;text-transform:uppercase;margin-bottom:14px\">03 / Team<\u002Fp>\n    <h2 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:clamp(32px,4.4vw,60px);letter-spacing:-0.035em;line-height:1.05;margin-bottom:36px\">The team<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,540px),1fr));gap:20px\">\n      <sc-for list=\"{{ teamPairs }}\" as=\"pair\" hint-placeholder-count=\"2\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:20px\">\n      <sc-for list=\"{{ pair.members }}\" as=\"m\" hint-placeholder-count=\"2\">\n        <article style=\"border-top:4px solid #a81612;background:#fff;border-radius:10px;padding:24px;box-shadow:0 6px 24px #4514000d;display:flex;flex-direction:column;gap:8px\">\n          <span style=\"width:48px;height:48px;border-radius:50%;background:#a81612;color:#fbf8f3;display:inline-flex;align-items:center;justify-content:center;font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;font-size:17px;letter-spacing:0.02em;margin-bottom:6px\">{{ m.initials }}<\u002Fspan>\n          <h3 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:24px;letter-spacing:-0.03em\">{{ m.name }}<\u002Fh3>\n          <span style=\"font-size:12px;letter-spacing:0.05em;text-transform:uppercase;color:#5c514c\">{{ m.role }}<\u002Fspan>\n          <p style=\"font-size:15px;margin-top:8px;color:#2a2a2a;text-wrap:pretty\">{{ m.contribution }}<\u002Fp>\n          <p style=\"font-size:15px;color:#5c514c;text-wrap:pretty;border-top:1px solid #ede6dc;padding-top:12px\">{{ m.bio }}<\u002Fp>\n        <\u002Farticle>\n      <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isQbr }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"QBR Dashboard\" style=\"padding:28px 4% 60px\">\n  <div style=\"max-width:1180px;margin:0 auto\">\n    <button sc-camel-on-click=\"{{ goHome }}\" style=\"all:unset;cursor:pointer;color:#a81612;font-weight:700;font-size:14px;margin-bottom:20px;display:inline-block\">← Back to home<\u002Fbutton>\n    <div style=\"background:#fff;border-top:7px solid #a81612;border-radius:10px;box-shadow:0 6px 24px #4514000d;padding:30px clamp(18px,3vw,36px)\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap\">\n        <div>\n          <p style=\"color:#a81612;font-weight:700;font-size:11px;letter-spacing:0.07em;text-transform:uppercase\">Week 6 / Quarterly Business Review<\u002Fp>\n          <h1 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:clamp(28px,3.4vw,40px);letter-spacing:-0.03em;line-height:1.1;margin:8px 0 6px\">Chipotle: is the rollout ready?<\u002Fh1>\n          <p style=\"font-size:14px;color:#5c514c\">Digital ordering, restaurant fulfillment and Rewards<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"text-align:right;font-size:12px;display:flex;flex-direction:column;gap:3px\">\n          <b style=\"color:#451400\">PROJECT Q7<\u002Fb>\n          <span>Quarter-end checkpoint<\u002Fspan>\n          <b style=\"color:#5c514c;letter-spacing:0.04em\">ILLUSTRATIVE DATA · NOT COMPANY RESULTS<\u002Fb>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:#f9e8e4;border-radius:8px;padding:14px 18px;margin:20px 0\">\n        <span style=\"background:#a81612;color:#fbf8f3;font-weight:800;font-size:18px;padding:8px 14px;border-radius:6px;letter-spacing:0.04em\">RED<\u002Fspan>\n        <p style=\"font-size:14px;flex:1;min-width:240px\"><b style=\"color:#451400\">Hold the next Chipotlane cohort.<\u002Fb> Pickup takes 4.2 minutes at the 90th percentile against a 3-minute limit. Delivery and Rewards can continue where their own checks pass.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px\">\n        <sc-for list=\"{{ phases }}\" as=\"ph\" hint-placeholder-count=\"3\">\n          <section style=\"border:1px solid #d1d1d1;border-radius:8px;padding:16px;display:flex;flex-direction:column\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5dbce;padding-bottom:10px\">\n              <div><span style=\"font-size:10px;color:#5c514c;letter-spacing:0.04em;text-transform:uppercase\">{{ ph.when }}<\u002Fspan><h2 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:24px;margin-top:2px\">{{ ph.name }}<\u002Fh2><\u002Fdiv>\n              <span style=\"font-size:11px;font-weight:700;color:{{ ph.color }};border:1px solid {{ ph.color }};border-radius:20px;padding:4px 10px;white-space:nowrap\">{{ ph.status }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ ph.metrics }}\" as=\"m\" hint-placeholder-count=\"3\">\n              <article style=\"padding:12px 0;border-bottom:1px solid #ede6dc\">\n                <p style=\"font-size:10px;color:#5c514c;line-height:1.4\">{{ m.id }} · {{ m.kind }}<br>{{ m.init }}<\u002Fp>\n                <h3 style=\"font-size:14px;color:#451400;margin:4px 0;font-weight:700\">{{ m.name }}<\u002Fh3>\n                <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\"><span style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-size:26px;font-weight:800;color:#2a2a2a\">{{ m.value }}<\u002Fspan><span style=\"font-size:11px;color:#5c514c\">Target: {{ m.target }}<\u002Fspan><\u002Fdiv>\n                <div style=\"position:relative;background:#ece5da;height:6px;border-radius:3px;margin:8px 0\">\n                  <div style=\"height:6px;border-radius:3px;background:{{ m.color }};width:{{ m.fill }}\"><\u002Fdiv>\n                  <span style=\"position:absolute;top:-4px;width:2px;height:14px;background:#451400;left:{{ m.tick }}\"><\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;font-size:11px\"><b style=\"color:{{ m.color }}\">{{ m.status }}<\u002Fb><span style=\"color:#5c514c\">Owner: {{ m.owner }}<\u002Fspan><\u002Fdiv>\n              <\u002Farticle>\n            <\u002Fsc-for>\n            <p style=\"font-size:12px;color:#5c514c;margin-top:12px;line-height:1.45\">{{ ph.note }}<\u002Fp>\n          <\u002Fsection>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <h2 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:20px;margin:28px 0 12px\">Decisions required this quarter<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px\">\n        <sc-for list=\"{{ qbrDecisions }}\" as=\"d\" hint-placeholder-count=\"3\">\n          <div style=\"border-top:3px solid #a81612;background:#fbf8f3;border-radius:6px;padding:14px;font-size:13px;line-height:1.5;display:flex;flex-direction:column;gap:6px\">\n            <b style=\"color:#451400;font-size:14px\">{{ d.title }}<\u002Fb>\n            <span>{{ d.text }}<\u002Fspan>\n            <b style=\"color:#a81612;font-size:12px\">{{ d.owner }}<\u002Fb>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;line-height:1.55;color:#5c514c;border-top:1px solid #d1d1d1;padding-top:14px;margin-top:22px;display:flex;flex-direction:column;gap:6px\">\n        <p><b style=\"color:#451400\">How to read the bars.<\u002Fb> Each bar starts at zero and the tick marks its target. Scales differ. For handoff time, shorter is better; the other measures should rise. Status shows target attainment, not a trend. A failed launch gate makes the dependent rollout red. Five leading and three lagging measures.<\u002Fp>\n        <p><b style=\"color:#451400\">Details.<\u002Fb> Definitions, thresholds, initiative names and sources are in the <button sc-camel-on-click=\"{{ goRoadmap }}\" style=\"all:unset;cursor:pointer;color:#a81612;text-decoration:underline\">Roadmap &amp; RACI<\u002Fbutton>. All Q7 figures and budget requests are illustrative.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isRoadmap }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"Roadmap &amp; RACI\">\n  <section style=\"padding:28px 4% 60px;border-bottom:5px solid #a81612\">\n    <button sc-camel-on-click=\"{{ goHome }}\" style=\"all:unset;cursor:pointer;color:#a81612;font-weight:700;font-size:14px\">← Back to home<\u002Fbutton>\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap;margin-top:40px\">\n      <div style=\"max-width:820px\">\n        <h1 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:clamp(40px,6vw,84px);letter-spacing:-0.04em;line-height:1\">Make digital growth work in the restaurant<\u002Fh1>\n      <\u002Fdiv>\n      <a href=\"Chipotle-Roadmap-RACI.pdf\" sc-camel-on-click=\"{{ downloadPdf }}\" style=\"cursor:pointer;display:inline-flex;align-items:center;gap:10px;background:#a81612;color:#fbf8f3;border-radius:8px;padding:15px 20px;font-weight:700;font-size:13px;letter-spacing:0.04em;text-transform:uppercase\" style-hover=\"background:#451400;color:#fbf8f3\">↓ Download PDF<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:30px;margin-top:40px;max-width:1100px\">\n      <p style=\"font-size:18px;text-wrap:pretty\"><b style=\"color:#451400\">Bottom line.<\u002Fb> A better app does not help much if the food is late. The plan connects ordering, kitchen work and Rewards so a problem in one does not slow the others.<\u002Fp>\n      <p style=\"font-size:16px;color:#2a2a2a;text-wrap:pretty\">Eight initiatives in three phases, seven governance decisions with one accountable owner each, and gates that stop expansion when a pilot misses its checks.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <nav style=\"padding:18px 4%;border-bottom:1px solid #d1d1d1;display:flex;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:700\">\n    <sc-for list=\"{{ rmNav }}\" as=\"n\" hint-placeholder-count=\"6\">\n      <a href=\"{{ n.href }}\" style=\"color:#451400;border:1px solid #d1d1d1;border-radius:20px;padding:7px 14px;background:#fff\" style-hover=\"border-color:#a81612;color:#a81612\">{{ n.label }}<\u002Fa>\n    <\u002Fsc-for>\n  <\u002Fnav>\n\n  <section id=\"rm-phases\" style=\"padding:70px 4%;border-bottom:1px solid #d1d1d1\">\n    <p style=\"color:#a81612;font-weight:700;font-size:12px;letter-spacing:0.055em;text-transform:uppercase;margin-bottom:12px\">00 / Phases<\u002Fp>\n    <h2 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:clamp(30px,3.8vw,52px);letter-spacing:-0.035em;line-height:1.05;margin-bottom:30px\">Three phases, each with an exit check<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px\">\n      <sc-for list=\"{{ phaseSummary }}\" as=\"p\" hint-placeholder-count=\"3\">\n        <article style=\"background:#fff;border:1px solid #d1d1d1;border-top:4px solid {{ p.color }};border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 24px #4514000d\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h3 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:28px\">{{ p.name }}<\u002Fh3><span style=\"font-size:12px;color:#5c514c;font-weight:700\">{{ p.when }}<\u002Fspan><\u002Fdiv>\n          <span style=\"font-size:11px;letter-spacing:0.05em;text-transform:uppercase;color:#5c514c\">{{ p.sub }}<\u002Fspan>\n          <p style=\"font-size:15px\">{{ p.what }}<\u002Fp>\n          <p style=\"font-size:14px;border-top:1px solid #e5dbce;padding-top:10px\"><b style=\"color:#451400\">To move on:<\u002Fb> {{ p.gate }}<\u002Fp>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"font-size:13px;color:#5c514c;margin-top:22px;max-width:900px\">Based on Chipotle's 2018–2023 annual reports and 2024 proxy statement. The sequence, pilot sizes, targets and owners are part of this proposal. Q1–Q8 are project quarters, not calendar dates.<\u002Fp>\n  <\u002Fsection>\n\n  <section id=\"rm-roadmap\" style=\"padding:70px 4%;border-bottom:1px solid #d1d1d1\">\n    <p style=\"color:#a81612;font-weight:700;font-size:12px;letter-spacing:0.055em;text-transform:uppercase;margin-bottom:12px\">01 / Roadmap<\u002Fp>\n    <h2 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:clamp(30px,3.8vw,52px);letter-spacing:-0.035em;line-height:1.05;margin-bottom:30px\">Build the basics, test them, then expand<\u002Fh2>\n    <div style=\"background:#fff;border:1px solid #d1d1d1;border-radius:10px;overflow-x:auto;box-shadow:0 6px 24px #4514000d\">\n      <div style=\"min-width:900px\">\n        <div style=\"display:grid;grid-template-columns:260px repeat(8,minmax(0,1fr));background:#451400;color:#fbf8f3;font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase\">\n          <div style=\"padding:12px 16px\">Initiative<\u002Fdiv>\n          <div style=\"grid-column:span 3;padding:12px;border-left:1px solid #fbf8f333\">Crawl: Foundation<\u002Fdiv>\n          <div style=\"grid-column:span 3;padding:12px;border-left:1px solid #fbf8f333\">Walk: Deployment<\u002Fdiv>\n          <div style=\"grid-column:span 2;padding:12px;border-left:1px solid #fbf8f333\">Run: Scale<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:260px repeat(8,minmax(0,1fr));font-size:12px;font-weight:700;color:#5c514c;border-bottom:1px solid #d1d1d1\">\n          <div><\u002Fdiv>\n          <sc-for list=\"{{ quarters }}\" as=\"q\" hint-placeholder-count=\"8\">\n            <div style=\"padding:10px 12px;border-left:{{ q.border }}\">{{ q.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-for list=\"{{ initiatives }}\" as=\"it\" hint-placeholder-count=\"8\">\n          <div style=\"display:grid;grid-template-columns:260px repeat(8,minmax(0,1fr));border-bottom:1px solid #ede6dc;align-items:center\">\n            <div style=\"padding:12px 16px;grid-row:1;grid-column:1;display:flex;gap:10px;align-items:baseline\"><b style=\"color:#a81612;font-size:13px\">{{ it.id }}<\u002Fb><span style=\"color:#451400;font-weight:700;font-size:14px\">{{ it.name }}<\u002Fspan><\u002Fdiv>\n            <sc-for list=\"{{ quarters }}\" as=\"q\" hint-placeholder-count=\"8\">\n              <div style=\"grid-row:1;grid-column:{{ q.col }};align-self:stretch;border-left:{{ q.border }}\"><\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"grid-row:1;grid-column:{{ it.span }};margin:8px 6px;padding:8px 10px;border-radius:6px;background:{{ it.color }};color:#fbf8f3;font-size:12px;font-weight:700;line-height:1.35\">{{ it.bar }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:13px;color:#5c514c;margin-top:14px\">Dashed red lines mark gate G1 (end of Q3) and gate G2 (end of Q6). Crawl initiatives run in parallel; none depends on another.<\u002Fp>\n    <h3 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:22px;margin:40px 0 16px\">Dependencies<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px\">\n      <sc-for list=\"{{ deps }}\" as=\"d\" hint-placeholder-count=\"9\">\n        <div style=\"background:#fff;border:1px solid #d1d1d1;border-radius:8px;padding:14px 16px;font-size:14px;display:flex;flex-direction:column;gap:4px\">\n          <b style=\"color:#451400\">{{ d.from }} → {{ d.to }}<\u002Fb>\n          <span style=\"color:#2a2a2a\">{{ d.text }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"rm-scope\" style=\"padding:70px 4%;border-bottom:1px solid #d1d1d1\">\n    <p style=\"color:#a81612;font-weight:700;font-size:12px;letter-spacing:0.055em;text-transform:uppercase;margin-bottom:12px\">02 / Scope &amp; checkpoints<\u002Fp>\n    <h2 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:clamp(30px,3.8vw,52px);letter-spacing:-0.035em;line-height:1.05;margin-bottom:30px\">What each initiative has to deliver<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:36px\">\n      <sc-for list=\"{{ scope }}\" as=\"g\" hint-placeholder-count=\"3\">\n        <div>\n          <div style=\"display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px\"><h3 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:22px\">{{ g.title }}<\u002Fh3><span style=\"font-size:14px;color:#5c514c\">{{ g.sub }}<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #d1d1d1;border-radius:10px;overflow-x:auto\">\n            <div style=\"min-width:820px\">\n              <div style=\"display:grid;grid-template-columns:1.1fr 0.6fr 1.6fr 1.4fr;background:#451400;color:#fbf8f3;font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase\">\n                <div style=\"padding:12px 14px\">Initiative<\u002Fdiv><div style=\"padding:12px 14px\">{{ g.c2 }}<\u002Fdiv><div style=\"padding:12px 14px\">{{ g.c3 }}<\u002Fdiv><div style=\"padding:12px 14px\">{{ g.c4 }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ g.rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                <div style=\"display:grid;grid-template-columns:1.1fr 0.6fr 1.6fr 1.4fr;border-top:1px solid #ede6dc;font-size:14px;line-height:1.5\">\n                  <div style=\"padding:14px;color:#451400;font-weight:700\"><span style=\"color:#a81612\">{{ r.id }}<\u002Fspan> {{ r.name }}<br><span style=\"font-weight:400;font-size:12px;color:#5c514c\">{{ r.q }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"padding:14px\">{{ r.b }}<\u002Fdiv>\n                  <div style=\"padding:14px\">{{ r.c }}<\u002Fdiv>\n                  <div style=\"padding:14px\">{{ r.d }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"rm-why\" style=\"padding:70px 4%;border-bottom:1px solid #d1d1d1;background:#f4efeb\">\n    <p style=\"color:#a81612;font-weight:700;font-size:12px;letter-spacing:0.055em;text-transform:uppercase;margin-bottom:12px\">03 / Why this order<\u002Fp>\n    <h2 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:clamp(30px,3.8vw,52px);letter-spacing:-0.035em;line-height:1.05;margin-bottom:30px\">The reasoning behind the phases<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:30px\">\n      <div><h3 style=\"color:#451400;font-size:19px;margin-bottom:10px\">Crawl: get the basics working<\u002Fh3><p style=\"font-size:15px\">Orders must reach the right kitchen, staff must know how to handle them, and Rewards records must be reliable. If these are broken, a pilot mostly shows setup problems, not whether the idea works. The three jobs run in parallel because each uses existing records and systems.<\u002Fp><\u002Fdiv>\n      <div><h3 style=\"color:#451400;font-size:19px;margin-bottom:10px\">Walk: try it small first<\u002Fh3><p style=\"font-size:15px\">One good week is not evidence. Each pilot tests a different risk: drivers collect orders on time, the lane queue moves quickly, and an offer brings people back compared with a no-offer group. Small pilots make problems easier to find and fix.<\u002Fp><\u002Fdiv>\n      <div><h3 style=\"color:#451400;font-size:19px;margin-bottom:10px\">Run: grow what passed<\u002Fh3><p style=\"font-size:15px\">A good delivery result does not prove a lane is ready, so approvals stay separate. A lane problem stops new lane openings, not delivery restaurants that meet their own checks. If performance drops, the next group is paused and fixed first.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:15px;margin-top:30px;max-width:980px\"><b style=\"color:#451400\">Dependency test.<\u002Fb> Without I1, pilot orders cannot be routed and measured. Without I2, added digital demand competes for an untested prep process. Without I3, a targeted offer has no usable records or permission to contact.<\u002Fp>\n    <h3 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:22px;margin:40px 0 16px\">Gates that stop expansion<\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px\">\n      <div style=\"background:#fff;border-radius:10px;border-top:4px dashed #a81612;padding:22px\"><b style=\"color:#a81612;font-size:13px;letter-spacing:0.05em\">G1 · END OF Q3<\u002Fb><p style=\"font-size:15px;margin-top:8px\">Accept only what a pilot needs: I1 routes correctly with no duplicate charges, I2 crews are ready, I3 profiles are usable and records without permission are excluded. Crawl takes nine months; a missed gate moves the next start date.<\u002Fp><\u002Fdiv>\n      <div style=\"background:#fff;border-radius:10px;border-top:4px dashed #a81612;padding:22px\"><b style=\"color:#a81612;font-size:13px;letter-spacing:0.05em\">G2 · END OF Q6 AND BEFORE EACH NEW GROUP<\u002Fb><p style=\"font-size:15px;margin-top:8px\">Check the pilot result, positive earnings after direct costs (delivery fees included), food-safety controls and staffing. I7 needs separate delivery and Chipotlane approvals; I8 needs a positive offer result and permission to contact.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <h3 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:22px;margin:40px 0 12px\">System and process choices<\u002Fh3>\n    <p style=\"font-size:15px;max-width:980px\">Keep one order ID across checkout, kitchen receipt and pickup. Use shared interfaces rather than restaurant-by-restaurant integrations. Keep Rewards identity and permissions consistent across campaigns. In the restaurant, separate digital prep from the front counter and give one person responsibility for the final order check. These are proposed design choices; the public reports do not describe Chipotle's internal systems.<\u002Fp>\n  <\u002Fsection>\n\n  <section id=\"rm-raci\" style=\"padding:70px 4%;border-bottom:1px solid #d1d1d1\">\n    <p style=\"color:#a81612;font-weight:700;font-size:12px;letter-spacing:0.055em;text-transform:uppercase;margin-bottom:12px\">04 / Governance RACI<\u002Fp>\n    <h2 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:clamp(30px,3.8vw,52px);letter-spacing:-0.035em;line-height:1.05;margin-bottom:16px\">Who owns the recurring decisions?<\u002Fh2>\n    <p style=\"font-size:14px;margin-bottom:24px\"><b style=\"color:#451400\">R<\u002Fb> prepares and carries out · <b style=\"color:#a81612\">A<\u002Fb> owns the decision (one per row) · <b style=\"color:#451400\">C<\u002Fb> consulted beforehand · <b style=\"color:#451400\">I<\u002Fb> informed afterward<\u002Fp>\n    <div style=\"background:#fff;border:1px solid #d1d1d1;border-radius:10px;overflow-x:auto;box-shadow:0 6px 24px #4514000d\">\n      <div style=\"min-width:980px\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,3.2fr) repeat(8,minmax(0,0.55fr));background:#451400;color:#fbf8f3;font-size:11px;font-weight:700;letter-spacing:0.05em\">\n          <div style=\"padding:13px 16px;text-transform:uppercase\">Decision / initiatives<\u002Fdiv>\n          <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"8\"><div style=\"padding:13px 4px;text-align:center\">{{ r.code }}<\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-for list=\"{{ raciRows }}\" as=\"row\" hint-placeholder-count=\"7\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,3.2fr) repeat(8,minmax(0,0.55fr));border-top:1px solid #ede6dc;align-items:stretch\">\n            <div style=\"padding:14px 16px;font-size:14px;line-height:1.45\"><b style=\"color:#a81612\">{{ row.id }}<\u002Fb> <span style=\"color:#451400;font-weight:700\">{{ row.q }}<\u002Fspan> <span style=\"color:#5c514c\">({{ row.inits }})<\u002Fspan><\u002Fdiv>\n            <sc-for list=\"{{ row.cells }}\" as=\"c\" hint-placeholder-count=\"8\">\n              <div style=\"display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;background:{{ c.bg }};color:{{ c.fg }}\">{{ c.v }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:13px;color:#5c514c;margin-top:16px;max-width:1000px;line-height:1.6\">D1–D5 are the five required decision types; D6 and D7 are specific to this case. CEO: Chief Executive Officer · CFAO: Chief Financial and Administrative Officer · CCTO: Chief Customer and Technology Officer · COO: Chief Operating Officer · CBO: Chief Brand Officer · CHRO: Chief Human Resources Officer · CLO: Chief Legal Officer and General Counsel · FS: Chief Corporate Affairs and Food Safety Officer. Titles follow the April 2024 executive structure (S6). These are proposed decision rights, not Chipotle's published approval policy. Food-safety and legal requirements stay mandatory and cannot be waived by the COO.<\u002Fp>\n  <\u002Fsection>\n\n  <section id=\"rm-accountability\" style=\"padding:70px 4%;border-bottom:1px solid #d1d1d1\">\n    <p style=\"color:#a81612;font-weight:700;font-size:12px;letter-spacing:0.055em;text-transform:uppercase;margin-bottom:12px\">05 / Accountability<\u002Fp>\n    <h2 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:clamp(30px,3.8vw,52px);letter-spacing:-0.035em;line-height:1.05;margin-bottom:30px\">Why that role gets the final call<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px\">\n      <sc-for list=\"{{ decisionsFull }}\" as=\"d\" hint-placeholder-count=\"7\">\n        <article style=\"background:#fff;border:1px solid #d1d1d1;border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:baseline\"><b style=\"color:#451400;font-size:17px\">{{ d.id }} {{ d.short }}<\u002Fb><span style=\"background:#a81612;color:#fbf8f3;font-size:12px;font-weight:700;border-radius:4px;padding:3px 8px\">A: {{ d.a }}<\u002Fspan><\u002Fdiv>\n          <p style=\"font-size:14px\"><b style=\"color:#451400\">Why this role.<\u002Fb> {{ d.why }}<\u002Fp>\n          <p style=\"font-size:14px\"><b style=\"color:#451400\">How it is enforced.<\u002Fb> {{ d.enforce }}<\u002Fp>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"font-size:14px;margin-top:22px;max-width:980px\">Before a decision is closed, its owner records the evidence, the people consulted, the answer and any conditions, with the decision ID and affected initiative IDs, in the launch record and quarterly business review. If a condition is missed, the release waits.<\u002Fp>\n  <\u002Fsection>\n\n  <section id=\"rm-evidence\" style=\"padding:70px 4%\">\n    <p style=\"color:#a81612;font-weight:700;font-size:12px;letter-spacing:0.055em;text-transform:uppercase;margin-bottom:12px\">06 / Evidence<\u002Fp>\n    <h2 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:clamp(30px,3.8vw,52px);letter-spacing:-0.035em;line-height:1.05;margin-bottom:30px\">What the company reported, and what the plan adds<\u002Fh2>\n    <div style=\"background:#fff;border:1px solid #d1d1d1;border-radius:10px;overflow:hidden\">\n      <sc-for list=\"{{ sources }}\" as=\"s\" hint-placeholder-count=\"6\">\n        <div style=\"display:grid;grid-template-columns:56px repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;padding:16px 18px;border-bottom:1px solid #ede6dc;font-size:14px\">\n          <b style=\"color:#a81612\">{{ s.id }}<\u002Fb><span style=\"color:#451400;font-weight:700\">{{ s.doc }}<\u002Fspan><span>{{ s.sup }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <h3 style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;color:#451400;font-size:22px;margin:36px 0 12px\">Limits of the case<\u002Fh3>\n    <p style=\"font-size:15px;max-width:980px\">The reports are historical and do not set the order, pilot sizes, targets, budget, internal system design or approval matrix; these are part of the proposal. Broader company programs are split into setup, pilot and rollout packages so dependencies can be tested. Higher digital sales alone would not show whether an offer or pickup lane caused a change, so customers who got an offer are compared with those who did not, alongside service times and costs. The case does not claim Chipotle used this sequence.<\u002Fp>\n    <div style=\"margin-top:36px;display:flex;gap:14px;flex-wrap:wrap\">\n      <a href=\"Chipotle-Roadmap-RACI.pdf\" sc-camel-on-click=\"{{ downloadPdf }}\" style=\"cursor:pointer;display:inline-flex;align-items:center;gap:10px;background:#a81612;color:#fbf8f3;border-radius:8px;padding:15px 20px;font-weight:700;font-size:13px;letter-spacing:0.04em;text-transform:uppercase\" style-hover=\"background:#451400;color:#fbf8f3\">↓ Download PDF<\u002Fa>\n      <button sc-camel-on-click=\"{{ goQbr }}\" style=\"background:#fff;color:#451400;border:2px solid #451400;border-radius:8px;padding:13px 20px;font-weight:700;font-size:13px;letter-spacing:0.04em;text-transform:uppercase\">Open QBR Dashboard →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<footer style=\"background:#451400;color:#fbf8f3;padding:50px 4% 0;overflow:hidden\">\n  <div style=\"display:flex;justify-content:space-between;gap:28px;flex-wrap:wrap\">\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <span style=\"font-family:'Trebuchet MS',Arial,sans-serif;font-weight:800;font-size:20px\">Chipotle Case<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:26px;flex-wrap:wrap;font-size:14px\">\n      <button sc-camel-on-click=\"{{ goHome }}\" style=\"all:unset;cursor:pointer\">Home<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goQbr }}\" style=\"all:unset;cursor:pointer\">QBR Dashboard<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goRoadmap }}\" style=\"all:unset;cursor:pointer\">Roadmap &amp; RACI<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-family:'Arial Black','Trebuchet MS',Arial,sans-serif;font-weight:900;font-size:16vw;letter-spacing:-0.06em;line-height:1;white-space:nowrap;margin-top:30px;padding-bottom:0.08em\">Chipotle<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst RED='#a81612',BROWN='#451400',CREAM='#fbf8f3',GREEN='#486e22',AMBER='#865900',SILVER='#d1d1d1';\nconst ROLES=[['CEO','Chief Executive Officer'],['CFAO','Chief Financial & Administrative Officer'],['CCTO','Chief Customer & Technology Officer'],['COO','Chief Operating Officer'],['CBO','Chief Brand Officer'],['CHRO','Chief Human Resources Officer'],['CLO','Chief Legal Officer'],['FS','Corporate Affairs & Food Safety']];\nconst DEC=[\n {id:'D1',short:'Budget',a:'CFAO',inits:'I1–I8',raci:'C A R R C C I C',q:\"How should next quarter's funding be split between platforms, offers and restaurant rollout?\",why:\"Someone has to look at all the costs together. Extra sales can look good on one team's report while discounts and extra work cost another team money.\",enforce:\"No project starts until Finance records its budget and how the benefit will be checked. Finance records every transfer and updates the forecast.\"},\n {id:'D2',short:'Architecture',a:'CCTO',inits:'I1, I2, I4, I5, I7',raci:'I C A R C I C C',q:'Which order, payment and kitchen interfaces are standard, and when is an exception allowed?',why:'The CCTO owns the connections that move an order across systems. One restaurant or delivery partner should not create an exception the rest of the business has to maintain.',enforce:'Interface changes need a recorded technical approval and end-to-end test results. Exceptions expire unless the CCTO renews them.'},\n {id:'D3',short:'Data',a:'CCTO',inits:'I1, I3, I6, I8',raci:'I I A C R I C I',q:'Who can use Rewards data, how is it checked, and which records are left out?',why:'The CCTO owns the customer technology and data controls used by every campaign. Brand defines the audience it needs; Legal checks permitted use before access is granted.',enforce:'Access requests name a purpose and owner. Audience checks block profiles with missing permission, and unresolved data errors stay out of campaigns.'},\n {id:'D4',short:'Prioritization',a:'CEO',inits:'I1–I8',raci:'A C R R R C I C',q:'Which initiative gets the next engineering team or restaurant trial slot?',why:'The CEO can settle trade-offs between digital growth, restaurant workload and the wider investment plan. Separate sponsors would promise the same people and trial sites twice.',enforce:'A shared project list shows what comes next and which teams are free. A priority change needs a recorded CEO decision before teams switch work.'},\n {id:'D5',short:'Vendors',a:'CCTO',inits:'I1, I4, I7',raci:'I C A R C I R C',q:'Which technology or delivery partners are chosen, kept, renegotiated or dropped?',why:'The CCTO owns whether a partner fits the ordering service and can be supported reliably. Finance reviews the economics; Operations and Legal prepare service and contract terms.',enforce:'Contracts need service measures, data-use limits, a tested exit route and an approved spending limit. Repeated service failures trigger a renewal review.'},\n {id:'D6',short:'Launch readiness',a:'COO',inits:'I2, I4, I5, I7',raci:'I C R A R R C C',q:'Is the next group of restaurants ready to launch, or should it be held?',why:'This decision affects the people running the restaurant. Equipment is not enough: staff must be ready and food must be on time.',enforce:'The checklist needs crew proficiency, channel-specific pilot results and food-safety checks. The COO signs each release, and a missed gate blocks that channel.'},\n {id:'D7',short:'Rewards offers',a:'CBO',inits:'I3, I6, I8',raci:'I C R C A I C I',q:'Which Rewards offers run, at what discount, and for which audiences?',why:'The CBO decides which offers fit the brand and give customers a reason to return. Finance checks profit and Operations checks restaurant capacity.',enforce:'Each offer needs customer rules, a budget, a no-offer comparison group and a stop point. No launch without Brand approval and data checks.'}];\nconst JOURNEY=[\n {num:'01',title:'Take the order',tag:'I1 · Digital ordering upgrade',text:'The app has to send the right order to the right restaurant. This is checked before more guests are asked to order online.'},\n {num:'02',title:'Make the food',tag:'I2 · Digital make-line setup',text:'A separate prep line only helps if staff can use it during a busy shift. The plan checks what crews can do, not just whether they attended training.'},\n {num:'03',title:'Hand it over',tag:'I4 + I5 · Delivery and Chipotlane pilots',text:'This is where the guest feels the result. A fast checkout means little if the food is late or handed to the wrong person.'}];\nconst ST={on:['On track',GREEN],risk:['At risk',AMBER],off:['Off track',RED]};\nconst M=(id,kind,init,name,value,target,fill,tick,s,owner)=>({id,kind,init,name,value,target,fill:fill+'%',tick:tick+'%',status:ST[s][0],color:ST[s][1],owner});\nconst PHASES=[\n {name:'Crawl',when:'Q1–Q3 · maintain readiness',s:'risk',note:'M2 is a shift demonstration, not a course-completion count. Incomplete Rewards profiles stay out of campaigns.',metrics:[\n  M('M1 / I1','Leading','Digital ordering upgrade','Orders routed correctly','99.7%','at least 99.5%',99.7,99.5,'on','CCTO'),\n  M('M2 / I2','Leading','Digital make-line setup','Crew ready for digital handoffs','82%','at least 90%',82,90,'risk','COO'),\n  M('M3 / I3','Leading','Chipotle Rewards data setup','Usable Rewards profiles','99%','at least 99.5%',99,99.5,'risk','CCTO')]},\n {name:'Walk',when:'Q4–Q6 · recheck the pilots',s:'off',note:'The lane trial is too slow. Delivery meets its handoff target, and the Rewards test shows a positive repeat-visit lift.',metrics:[\n  M('M4 / I4','Leading','Delivery integration pilot','Delivery orders ready on time','96%','at least 95%',96,95,'on','COO'),\n  M('M5 / I5','Lagging','Chipotlane pilot','Chipotlane handoff time','4.2 min','at most 3.0 min',70,50,'off','COO'),\n  M('M6 / I6','Leading','Personalized Rewards pilot','30-day repeat-visit lift','+2.4 pp','at least +2.0 pp',60,50,'on','CBO')]},\n {name:'Run',when:'Q7–Q8+ · release by cohort',s:'off',note:'I5 blocks the next I7 Chipotlane cohort, so Run is red. Delivery sites and Rewards audiences can proceed where their own checks pass.',metrics:[\n  M('M7 / I7','Lagging','Digital fulfillment rollout','Digital contribution per order','$1.85','at least $2.00',61.67,66.67,'risk','CFAO'),\n  M('M8 / I8','Lagging','Personalized Rewards rollout','Net contribution from offers','$0.34m','at least $0.30m',68,60,'on','CFAO')]}];\nconst QBR_DEC=[\n {title:'D6 / Hold the next Chipotlane cohort',text:'Keep I7 Chipotlane openings on hold until I5 handoffs are at or below 3 minutes for four weeks and I2 crew readiness reaches 90%. Delivery can proceed where its own checks pass.',owner:'COO · Q7 week 2'},\n {title:'D1 / Move $75,000 into training and handoff fixes',text:'Shift proposed spending from the next Chipotlane cohort to I2/I5 coaching, shift coverage and pickup-flow fixes. Finance must approve the cost breakdown and revised opening forecast.',owner:'CFAO · Q7 week 2'},\n {title:'D7 / Limit the next Rewards campaign',text:'Continue I8 only in eligible, capacity-ready restaurants. Keep the holdout and cap offer volume where pickup performance is below the launch threshold.',owner:'CBO · Q7 week 3'}];\nconst INITS=[['I1','Digital ordering upgrade',1,3,'Q1–Q3',BROWN],['I2','Digital make-line setup',1,3,'Q1–Q3',BROWN],['I3','Chipotle Rewards data setup',1,3,'Q1–Q3',BROWN],['I4','Delivery integration pilot',4,5,'Q4–Q5 · needs I1, I2',RED],['I5','Chipotlane pilot',4,6,'Q4–Q6 · needs I1, I2',RED],['I6','Personalized Rewards pilot',4,6,'Q4–Q6 · needs I1, I3',RED],['I7','Digital fulfillment rollout',7,8,'Q7–Q8+ · scales I4, I5',GREEN],['I8','Personalized Rewards rollout',7,8,'Q7–Q8+ · scales I6',GREEN]];\nconst DEPS=[['I1 Ordering upgrade','I4 Delivery pilot','Routes and reconciles delivery orders without duplicate tickets.'],['I2 Make-line setup','I4 Delivery pilot','Provides kitchen capacity and a named driver-handoff step.'],['I1 Ordering upgrade','I5 Chipotlane pilot','Links a prepaid order to the correct pickup restaurant and guest.'],['I2 Make-line setup','I5 Chipotlane pilot','Provides a separate prep queue and trained pickup crews.'],['I1 Ordering upgrade','I6 Rewards pilot','Records offer redemption and the follow-up purchase.'],['I3 Rewards data setup','I6 Rewards pilot','Provides customer groups with permission and purchase history.'],['I4 Delivery pilot','I7 Fulfillment rollout','Provides the tested delivery process and partner economics.'],['I5 Chipotlane pilot','I7 Fulfillment rollout','Provides the tested Chipotlane layout, staffing and handoff rules.'],['I6 Rewards pilot','I8 Rewards rollout','Provides a measured offer effect and a reusable control-group design.']];\nconst SCOPE=[\n {title:'Crawl: Foundation',sub:'Q1–Q3 · No Crawl initiative depends on another; each uses existing systems.',c2:'Quarters',c3:'Capability created for Walk',c4:'Exit check',rows:[\n  {id:'I1',name:'Digital ordering upgrade',q:'',b:'Q1–Q3',c:'One order ID from payment to kitchen receipt; reliable routing. Uses the existing point-of-sale system.',d:'99.5% of orders reach the right place for four weeks; no duplicate charges.'},\n  {id:'I2',name:'Digital make-line setup',q:'',b:'Q1–Q3',c:'A separate prep line for digital orders and crews trained to make, check and hand over. Uses point-of-sale test tickets.',d:'90% of sampled crew pass a practice shift.'},\n  {id:'I3',name:'Chipotle Rewards data setup',q:'',b:'Q1–Q3',c:'Member IDs linked to purchases and permission to send offers. Uses existing sign-up and purchase records.',d:'99.5% of sampled profiles usable; no-permission records excluded.'}]},\n {title:'Walk: Deployment',sub:'Q4–Q6 · Limited pilots; each names its Crawl dependency.',c2:'Depends on',c3:'Limited scope',c4:'Readiness outcome',rows:[\n  {id:'I4',name:'Delivery integration pilot',q:'Q4–Q5',b:'I1 and I2',c:'20 US restaurants, one partner.',d:'95% of orders ready by the promised pickup time for four weeks.'},\n  {id:'I5',name:'Chipotlane pilot',q:'Q4–Q6',b:'I1 and I2',c:'Five suitable US sites.',d:'90% of guests served within 3 minutes for four weeks.'},\n  {id:'I6',name:'Personalized Rewards pilot',q:'Q4–Q6',b:'I3 and I1',c:'One offer, 50,000 members; half get it, half are a holdout.',d:'At least +2 points in 30-day repeat visits (95% interval above zero).'}]},\n {title:'Run: Scale',sub:'Q7–Q8+ · Each rollout names the Walk initiative it scales.',c2:'Scales',c3:'Full-scale scope',c4:'Organizational change required',rows:[\n  {id:'I7',name:'Digital fulfillment rollout',q:'Q7–Q8+',b:'I4 (delivery) and I5 (Chipotlane); each channel needs its own pass.',c:'US restaurants the service can reach; suitable new or converted Chipotlane sites. National operating plan by Q8.',d:\"Restaurant leaders adopt the same staffing and pickup rules; COO signs each group's release; delivery partners checked weekly.\"},\n  {id:'I8',name:'Personalized Rewards rollout',q:'Q7–Q8+',b:'I6',c:'All suitable US member groups, with no-offer comparison groups kept.',d:'Brand reviews offers weekly; Finance sets discount limits; Operations can reduce offers when restaurants are busy.'}]}];\nconst SOURCES=[['S1','Chipotle 2018 Form 10-K, Item 1: Guest Experience and Operations; Innovation','I1, I5: mobile ordering, digital payments, Chipotlanes'],['S2','Chipotle 2019 Annual Report, p. 5: Innovation and Marketing','I2, I3, I6: digital make lines, Rewards launch, individual-level marketing'],['S3','Chipotle 2020 Form 10-K, Item 1: Digital Business','I4, I5, I7: third-party delivery, digital make lines, Chipotlanes'],['S4','Chipotle 2021 Form 10-K, p. 21: 2021 Financial Highlights','I6, I8: June 2021 redemption choices and personalized offers'],['S5','Chipotle 2023 Annual Report, pp. 5 and 9: Digital Business and risks','I1, I7, I8: app improvements, delivery, Chipotlanes, cost and service risks'],['S6','Chipotle 2024 Proxy Statement, pp. 51–52: Executive Officers','RACI role titles as of April 1, 2024']];\nconst TEAM=[\n ['AS','Alifya Saify','Roadmap Sequencer',\"As Roadmap Sequencer, she organized Chipotle's digital initiatives, dependencies and rollout phases (Roadmap & RACI).\",\"Alifya has a background in marketing and business analysis, with an interest in using technology and AI to improve business strategy.\"],\n ['DR','Disha Reddy','Governance Designer',\"As Governance Designer, she helped define the roles, responsibilities and guidelines that keep the digital roadmap organized and aligned (RACI).\",\"Disha has a background in data engineering and is pursuing her master's in AI in Business and Enterprise Integration.\"],\n ['RM','Rishit Mathur','Dashboard Designer',\"As Dashboard Designer, he built the quarterly dashboard: eight measures, owners and thresholds (QBR Dashboard).\",\"Rishit built the quarterly dashboard so a leadership team can see which channel to hold instead of reading one overall score. He chose eight measures with named owners and wrote the Q7 example to show how a hold decision is reached.\"],\n ['SK','Shima Kananiazari','Dashboard Designer / review coordination',\"As Dashboard Designer and review coordinator, she develops the About Us content, checks the roadmap, RACI and dashboard for consistency, and helps bring the final submission together.\",\"Shima works in banking and brings a customer's perspective. She likes Chipotle for its quick, customizable meals and open kitchen, where she can watch her food being made.\"]];\n\nclass Component extends DCLogic {\n  state={view:'home',journey:0,decision:'D6',role:null,pickup:4.2,crew:82,checks:true};\n  go(v){this.setState({view:v});window.scrollTo(0,0);}\n  renderVals(){\n    const s=this.state,set=o=>this.setState(o);\n    const dec=DEC.find(d=>d.id===s.decision);\n    const pOk=s.pickup<=3,cOk=s.crew>=90,ready=pOk&&cOk&&s.checks;\n    const qBorder=i=>i===3||i===6?'2px dashed '+RED:(i===0?'none':'1px solid #ede6dc');\n    const quarters=['Q1','Q2','Q3','Q4','Q5','Q6','Q7','Q8+'].map((l,i)=>({label:l,col:String(i+2),border:qBorder(i)}));\n    return {\n      isHome:s.view==='home',isQbr:s.view==='qbr',isRoadmap:s.view==='roadmap',\n      navHome:s.view==='home'?RED:'transparent',navQbr:s.view==='qbr'?RED:'transparent',navRoadmap:s.view==='roadmap'?RED:'transparent',\n      downloadPdf:e=>{if(!window.ROADMAP_PDF_B64)return;e.preventDefault();const bin=atob(window.ROADMAP_PDF_B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const url=URL.createObjectURL(new Blob([u],{type:'application/pdf'}));const a=document.createElement('a');a.href=url;a.download='Chipotle-Roadmap-RACI.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);},\n      goHome:()=>this.go('home'),goQbr:()=>this.go('qbr'),goRoadmap:()=>this.go('roadmap'),\n      journey:JOURNEY.map((j,i)=>{const on=i===s.journey;return {...j,pick:()=>set({journey:i}),bg:on?RED:'#fff',fg:on?CREAM:BROWN,border:on?RED:'#8e8e8e'};}),\n      journeyActive:JOURNEY[s.journey],\n      decisions:DEC.map(d=>({id:d.id,label:d.id+' · '+d.q})),\n      raciDecision:s.decision,onDecision:e=>set({decision:e.target.value,role:null}),\n      roleChoices:ROLES.map(([c,n])=>{const on=s.role===c;return {code:c,name:n,pick:()=>set({role:c}),bg:on?RED:'#fff',fg:on?CREAM:BROWN,border:on?RED:'#8e8e8e'};}),\n      hasRolePick:!!s.role,noRolePick:!s.role,activeDecision:dec,\n      verdict:s.role===dec.a?'Correct: this matches the plan':'Not quite: the plan assigns this to the '+dec.a,\n      verdictColor:s.role===dec.a?GREEN:RED,\n      pickup:s.pickup,crew:s.crew,otherChecks:s.checks,\n      onPickup:e=>set({pickup:parseFloat(e.target.value)}),onCrew:e=>set({crew:parseInt(e.target.value)}),onChecks:e=>set({checks:e.target.checked}),\n      pickupLabel:s.pickup.toFixed(1)+' min',crewLabel:s.crew+'%',\n      pickupState:pOk?'pass':'miss',crewState:cOk?'pass':'miss',checksState:s.checks?'passed':'not confirmed',\n      simBg:ready?GREEN:RED,\n      simTitle:ready?'Ready to release the next group':'Hold the next Chipotlane group',\n      simText:ready?'All launch checks pass. The COO can sign the release under D6, provided the results hold for four weeks.':'At least one launch check is missing. Under D6 the next group stays on hold until it is fixed.',\n      teamPairs:[0,2].map(k=>({members:TEAM.slice(k,k+2).map(([initials,name,role,contribution,bio])=>({initials,name,role,contribution,bio}))})),\n      phases:PHASES.map(p=>({...p,status:ST[p.s][0],color:ST[p.s][1]})),\n      qbrDecisions:QBR_DEC,\n      rmNav:[['Phases','#rm-phases'],['Roadmap','#rm-roadmap'],['Scope','#rm-scope'],['Why this order','#rm-why'],['RACI','#rm-raci'],['Accountability','#rm-accountability'],['Evidence','#rm-evidence']].map(([label,href])=>({label,href})),\n      phaseSummary:[\n        {name:'Crawl',sub:'Foundation',when:'Q1–Q3',color:BROWN,what:'I1 ordering, I2 digital make line and I3 Rewards data are built in parallel.',gate:'Orders routed correctly (99.5%), crews ready (90%), usable profiles (99.5%).'},\n        {name:'Walk',sub:'Deployment',when:'Q4–Q6',color:RED,what:'I4 delivery in 20 restaurants, I5 Chipotlane at 5 sites, I6 Rewards offer for 50,000 members.',gate:'95% on-time delivery, 3-minute lane handoff, 2-point repeat-visit lift.'},\n        {name:'Run',sub:'Scale',when
